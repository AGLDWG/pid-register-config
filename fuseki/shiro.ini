[main]
ssl.enabled = false
plainMatcher = org.apache.shiro.authc.credential.SimpleCredentialsMatcher
iniRealm.credentialsMatcher = $plainMatcher

[users]
admin = ${ADMIN_PASSWORD}, admin
${PIDDATA_USERNAME} = ${PIDDATA_PASSWORD}, piddata

[roles]
admin = *
piddata = *

[urls]
/$/ping = anon
/** = authcBasic
