events {}

http {
    include /etc/nginx/mime.types;

    server {
        listen 3000 default_server;
        server_name localhost;
        root /usr/share/nginx/html;

        location = /api {
            proxy_pass ${PREZ_UPSTREAM}/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass ${PREZ_UPSTREAM}/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 32k;
            proxy_buffering on;
        }

        # Swagger UI served through /api/docs uses an origin-relative schema URL.
        location = /openapi.json {
            proxy_pass ${PREZ_UPSTREAM}/openapi.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /docs/oauth2-redirect {
            proxy_pass ${PREZ_UPSTREAM}/docs/oauth2-redirect;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            index index.html;
            # Serve generated pages without adding a slash to the client route.
            # Prez API routes use the same path and do not end in a slash.
            try_files $uri $uri/index.html /index.html =404;
        }
    }
}
